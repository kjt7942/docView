name: Release APK

# main에 푸시하면, pubspec.yaml의 버전에 해당하는 릴리스(v<버전>)가 아직 없을 때
# APK를 빌드해서 GitHub Release에 올린다. 새 릴리스는 pubspec.yaml의 version만 올리면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미 릴리스된 버전인지 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if gh release view "v${VERSION}" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "push" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} 릴리스가 이미 있어 건너뜁니다."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.build == 'true'
        with:
          channel: stable
          cache: true

      - name: 릴리스 서명 키 준비
        if: steps.check.outputs.build == 'true'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          PROPS
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 시크릿이 없어 디버그 키로 서명합니다. 기존 설치본과 서명이 달라 덮어쓰기 업데이트가 안 됩니다."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
        if: steps.check.outputs.build == 'true'
      - run: flutter analyze
        if: steps.check.outputs.build == 'true'
      - run: flutter test
        if: steps.check.outputs.build == 'true'

      - name: APK 빌드
        if: steps.check.outputs.build == 'true'
        run: flutter build apk --release --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: 에셋 이름 정리
        if: steps.check.outputs.build == 'true'
        id: asset
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "docviewer-${VERSION}.apk"
          echo "name=docviewer-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release 생성
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.asset.outputs.version }}"
          # 앱의 업데이트 안내 창에 릴리스 노트가 그대로 보이므로 커밋 메시지(트레일러 제외)를 쓴다.
          NOTES=$(git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):')
          # 릴리스 키로 서명하지 못했다면 prerelease로 올려 앱의 자동 업데이트(latest)에 잡히지 않게 한다.
          FLAGS=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then FLAGS="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.asset.outputs.name }}" --clobber
          else
            gh release create "$TAG" "${{ steps.asset.outputs.name }}" \
              --target "${{ github.sha }}" --title "$TAG" --notes "$NOTES" $FLAGS
          fi
