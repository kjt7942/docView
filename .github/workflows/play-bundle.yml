name: Play bundle (AAB)

# Google Play 업로드용 App Bundle을 만든다. 수동 실행 전용.
# 자체 업데이트(GITHUB_REPO)와 REQUEST_INSTALL_PACKAGES 권한이 빠진 스토어 빌드다.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      STORE_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 릴리스 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없어 Play에 올릴 수 있는 서명을 할 수 없습니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          PROPS

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: docviewer-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
